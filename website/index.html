<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1C5C4B" />
    <title>CodeVariant School ERP — Modern School Management Software</title>
    <meta
      name="description"
      content="CodeVariant School ERP is a premium, all-in-one school management platform for schools, colleges, coaching institutes, and universities — admissions, fees, attendance, exams, HR, and more in one place."
    />
    <link rel="canonical" href="https://www.codevariant.example/" />

    <!--
      These static tags only cover the root URL, since social-link
      unfurlers (Twitter/LinkedIn/Facebook) generally don't execute JS —
      per-route previews would need SSR/SSG, which is out of scope here.
      TODO: replace codevariant.example with the real production domain,
      and public/og-image.png with a real 1200x630 exported PNG.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CodeVariant School ERP" />
    <meta property="og:title" content="CodeVariant School ERP — Modern School Management Software" />
    <meta
      property="og:description"
      content="The all-in-one school ERP for schools, colleges, coaching institutes, and universities — admissions, fees, attendance, exams, HR, and more in one place."
    />
    <meta property="og:url" content="https://www.codevariant.example/" />
    <meta property="og:image" content="https://www.codevariant.example/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CodeVariant School ERP — Modern School Management Software" />
    <meta
      name="twitter:description"
      content="The all-in-one school ERP for schools, colleges, coaching institutes, and universities."
    />
    <meta name="twitter:image" content="https://www.codevariant.example/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
